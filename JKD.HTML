<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--list iframe and form s are -->
    <iframe src="https://www.dmu.edu.et" frameborder="1" width="600" height="400"></iframe>
    <form action="html.html" method="get"></form>
    
    <dl>
    <dt>iframe</dt>
    <dd> for embedding external content</dd>
    <dt>form</dt>
    <dd> for creating interactive forms</dd>
    <ol type="I">
        <li>text</li>
        <li>password</li>
        <li>email</li>
        <li>number</li>
    </ol>
    <ol >
        <li type="circle">get</li>
        <li type="circle">post</li>
    </ol>
    </dl>
    <hr>
    <h3>html forms</h3>
    <fieldset>
        <legend align="center">Personal Information</legend>
        <form action="">
            <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br>
        <label for="subscribe">Subscribe to newsletter:</label>
        <input type="checkbox" name="subscribe" id="subscribe">
        <br>
        <label for="male">Gender:</label>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>
        </form>
    </fieldset>
    <hr>
    <datalist id="markers">
    </datalist>
</body>
</html>
